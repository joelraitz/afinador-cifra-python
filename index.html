<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afinador Web Interativo</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; color: #333; text-align: center; margin-top: 50px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
        .note { font-size: 72px; font-weight: bold; color: #2c3e50; margin: 20px 0; }
        .freq { font-size: 20px; color: #7f8c8d; }
        button { background-color: #27ae60; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #219150; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Afinador Online</h1>
        <button id="startBtn" onclick="iniciarAfinador()">Ativar Microfone</button>
        <div class="note" id="noteDisplay">--</div>
        <div class="freq" id="freqDisplay">0.0 Hz</div>
    </div>

    <script>
        let audioCtx, analyser, dataArray;
        const notes = ['Dó (C)', 'Dó# (C#)', 'Ré (D)', 'Ré# (D#)', 'Mi (E)', 'Fá (F)', 'Fá# (F#)', 'Sol (G)', 'Sol# (G#)', 'Lá (A)', 'Lá# (A#)', 'Si (B)'];

        async function iniciarAfinador() {
            document.getElementById('startBtn').style.display = 'none';
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 2048;
            
            const source = audioCtx.createMediaStreamSource(stream);
            source.connect(analyser);
            dataArray = new Float32Array(analyser.fftSize);
            
            detectarPitch();
        }

        function detectarPitch() {
            analyser.getFloatTimeDomainData(dataArray);
            let pitch = autoCorrelate(dataArray, audioCtx.sampleRate);
            
            if (pitch !== -1 && pitch > 60 && pitch < 1000) {
                let noteNum = 12 * (Math.log2(pitch / 440)) + 69;
                let noteIndex = Math.round(noteNum) % 12;
                if (noteIndex < 0) noteIndex += 12;
                
                document.getElementById('noteDisplay').innerText = notes[noteIndex];
                document.getElementById('freqDisplay').innerText = pitch.toFixed(1) + " Hz";
            }
            requestAnimationFrame(detectarPitch);
        }

        function autoCorrelate(buf, sampleRate) {
            let SIZE = buf.length, rms = 0;
            for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
            rms = Math.sqrt(rms / SIZE);
            if (rms < 0.01) return -1;

            let r1 = 0, r2 = SIZE - 1, thres = 0.2;
            for (let i = 0; i < SIZE / 2; i++) if (Math.abs(buf[i]) < thres) { r1 = i; break; }
            for (let i = 1; i < SIZE / 2; i++) if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }

            buf = buf.slice(r1, r2);
            SIZE = buf.length;

            let c = new Array(SIZE).fill(0);
            for (let i = 0; i < SIZE; i++)
                for (let j = 0; j < SIZE - i; j++)
                    c[i] = c[i] + buf[j] * buf[j + i];

            let d = 0; while (c[d] > c[d + 1]) d++;
            let maxval = -1, maxpos = -1;
            for (let i = d; i < SIZE; i++) {
                if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
            }
            return sampleRate / maxpos;
        }
    </script>
</body>
</html>
