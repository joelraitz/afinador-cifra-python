<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cifra Club Style - Gerador de Cifras</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --cc-bg: #121212;
            --cc-card: #1e1e1e;
            --cc-orange: #ff7900;
            --cc-yellow: #ffc107;
            --cc-text: #ffffff;
            --cc-subtext: #aaa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--cc-bg);
            color: var(--cc-text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: var(--cc-card);
            width: 100%;
            max-width: 650px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border-top: 5px solid var(--cc-orange);
            text-align: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: var(--cc-orange);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .logo span { color: var(--cc-text); }
        p { color: var(--cc-subtext); font-size: 14px; margin-bottom: 20px; }

        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: var(--cc-yellow);
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        input[type="text"], textarea {
            width: 100%;
            background: #181818;
            border: 1px solid #333;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
        }

        textarea {
            height: 120px;
            resize: vertical;
            font-family: monospace;
        }

        .upload-area {
            border: 2px dashed #333;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            background: #181818;
            text-align: center;
        }

        input[type="file"] { color: var(--cc-subtext); }

        button {
            background-color: var(--cc-orange);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            text-transform: uppercase;
        }

        button:hover {
            background-color: #e06b00;
            transform: translateY(-2px);
        }

        #status {
            margin-top: 20px;
            font-weight: 500;
            color: var(--cc-yellow);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">cifra<span>club</span></div>
        <p>Gerador de Cifras e Transcrição com IA do Navegador</p>

        <div class="form-group">
            <label for="songTitle">Nome da Música / Artista</label>
            <input type="text" id="songTitle" placeholder="Ex: Fanuel - Nome da Musica">
        </div>

        <div class="form-group">
            <label for="lyricsInput">Letra da Música (Opcional)</label>
            <textarea id="lyricsInput" placeholder="Cole a letra da música aqui. Os acordes extraídos do áudio serão posicionados automaticamente acima de cada linha."></textarea>
        </div>

        <div class="upload-area">
            <label style="margin-bottom: 10px;">Arquivo de Áudio (.mp3 / .wav)</label>
            <input type="file" id="audioInput" accept="audio/*">
        </div>

        <button onclick="processarAudio()">Gerar Cifra Completa em PDF</button>

        <div id="status"></div>
    </div>

    <script>
        const notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

        async function processarAudio() {
            const input = document.getElementById('audioInput');
            const songTitle = document.getElementById('songTitle').value || 'Música Sem Título';
            const lyricsText = document.getElementById('lyricsInput').value;
            const status = document.getElementById('status');

            if (input.files.length === 0) {
                alert('Por favor, selecione um arquivo de áudio!');
                return;
            }

            const file = input.files[0];
            status.innerText = "⚡ Analisando frequências da música e extraindo harmonia...";

            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const arrayBuffer = await file.arrayBuffer();
                const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

                const channelData = audioBuffer.getChannelData(0);
                const sampleRate = audioBuffer.sampleRate;
                const step = Math.floor(sampleRate / 2);
                
                let acordes = [];
                let contagemNotas = new Array(12).fill(0);

                for (let i = 0; i < channelData.length; i += step) {
                    let slice = channelData.slice(i, i + 2048);
                    let freq = estimarPitch(slice, sampleRate);
                    
                    if (freq > 60 && freq < 1000) {
                        let noteNum = Math.round(12 * Math.log2(freq / 440) + 69);
                        let noteIdx = (noteNum % 12 + 12) % 12;
                        let nota = notes[noteIdx];
                        
                        contagemNotas[noteIdx]++;
                        if (acordes.length === 0 || acordes[acordes.length - 1] !== nota) {
                            acordes.push(nota);
                        }
                    }
                }

                let maxIdx = contagemNotas.indexOf(Math.max(...contagemNotas));
                let tonalidade = notes[maxIdx] || 'C';

                if (acordes.length === 0) acordes = ['C', 'G', 'Am', 'F'];

                status.innerText = "📄 Montando layout no padrão Cifra Club...";
                gerarPDFEstiloCifraClub(songTitle, tonalidade, acordes, lyricsText);
                status.innerText = "✅ PDF gerado e baixado com sucesso!";

            } catch (err) {
                console.error(err);
                status.innerText = "❌ Erro ao processar o arquivo de áudio.";
            }
        }

        function estimarPitch(buffer, sampleRate) {
            let SIZE = buffer.length;
            let rms = 0;
            for (let i = 0; i < SIZE; i++) rms += buffer[i] * buffer[i];
            if (Math.sqrt(rms / SIZE) < 0.01) return -1;

            let c = new Array(SIZE).fill(0);
            for (let i = 0; i < SIZE; i++) {
                for (let j = 0; j < SIZE - i; j++) {
                    c[i] += buffer[j] * buffer[j + i];
                }
            }

            let d = 0;
            while (c[d] > c[d + 1]) d++;
            let maxval = -1, maxpos = -1;
            for (let i = d; i < SIZE; i++) {
                if (c[i] > maxval) {
                    maxval = c[i];
                    maxpos = i;
                }
            }
            return sampleRate / maxpos;
        }

        function gerarPDFEstiloCifraClub(nomeMusica, tonalidade, acordes, letra) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // Topo Laranja
            doc.setFillColor(255, 121, 0);
            doc.rect(0, 0, 210, 25, 'F');
            
            doc.setTextColor(255, 255, 255);
            doc.setFont("helvetica", "bold");
            doc.setFontSize(16);
            doc.text("cifra club", 15, 16);

            // Título e Tom
            doc.setTextColor(30, 30, 30);
            doc.setFontSize(20);
            doc.text(nomeMusica, 15, 40);

            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            doc.setTextColor(100, 100, 100);
            doc.text(`Tom: ${tonalidade}  |  Afinação: Padrão (E A D G B E)`, 15, 47);

            doc.setDrawColor(220, 220, 220);
            doc.line(15, 52, 195, 52);

            doc.setFont("courier", "bold");
            doc.setFontSize(11);

            let y = 65;
            let chordIdx = 0;

            if (letra.trim().length > 0) {
                const linhas = letra.split('\n');
                
                linhas.forEach((linha) => {
                    if (linha.trim() !== "") {
                        // Linha de Acordes (Laranja)
                        let acordeLinha = (acordes[chordIdx % acordes.length] || 'C') + "          " + (acordes[(chordIdx + 1) % acordes.length] || 'G');
                        chordIdx += 2;

                        doc.setTextColor(255, 121, 0);
                        doc.text(acordeLinha, 15, y);
                        y += 6;

                        // Linha da Letra (Preto)
                        doc.setTextColor(40, 40, 40);
                        doc.setFont("courier", "normal");
                        doc.text(linha.substring(0, 60), 15, y);
                        doc.setFont("courier", "bold");
                        y += 10;
                    } else {
                        y += 5;
                    }

                    if (y > 270) {
                        doc.addPage();
                        y = 20;
                    }
                });
            } else {
                // Caso não tenha letra, exibe a sequência de acordes estilo tablatura/intro
                doc.setTextColor(255, 121, 0);
                doc.text("[Intro] " + acordes.slice(0, 4).join("  "), 15, y);
                y += 12;

                let bloco = "";
                for (let i = 0; i < acordes.length; i++) {
                    bloco += acordes[i] + "  ";
                    if ((i + 1) % 6 === 0) {
                        doc.setTextColor(255, 121, 0);
                        doc.text(bloco, 15, y);
                        y += 12;
                        bloco = "";
                    }
                }
                if (bloco) doc.text(bloco, 15, y);
            }

            doc.save(`${nomeMusica.replace(/\s+/g, '_')}_CifraClub.pdf`);
        }
    </script>
</body>
</html>
