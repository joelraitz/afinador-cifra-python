<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisador de Áudio & Cifrador</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; color: #333; text-align: center; margin-top: 50px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto; }
        input[type="file"] { margin: 20px 0; }
        button { background-color: #27ae60; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #219150; }
        #status { margin-top: 15px; font-weight: bold; color: #2c3e50; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Gerar Cifra em PDF</h1>
        <p>Selecione um arquivo de áudio (.mp3 ou .wav) para analisar a tonalidade, extrair os acordes e baixar o PDF cifrado.</p>
        
        <input type="file" id="audioInput" accept="audio/*"><br>
        <button onclick="enviarAudio()">Processar Áudio e Baixar PDF</button>
        
        <div id="status"></div>
    </div>

    <script>
        async function enviarAudio() {
            const input = document.getElementById('audioInput');
            const status = document.getElementById('status');

            if (input.files.length === 0) {
                alert('Por favor, selecione um arquivo de áudio primeiro!');
                return;
            }

            const formData = new FormData();
            formData.append('audio', input.files[0]);

            status.innerText = "Analisando áudio e gerando PDF... Aguarde.";

            try {
                // Endereço local do backend Python
                const response = await fetch('http://127.0.0.1:5000/processar-audio', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('Erro ao processar o áudio');

                // Baixar o arquivo PDF retornado
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'cifra_musica.pdf';
                document.body.appendChild(a);
                a.click();
                a.remove();

                status.innerText = "PDF gerado com sucesso!";
            } catch (error) {
                status.innerText = "Erro ao conectar com o servidor Python. Certifique-se de que o app.py está rodando.";
                console.error(error);
            }
        }
    </script>
</body>
</html>
